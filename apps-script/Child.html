<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px system-ui;background:#eef4f7;color:#173d59;max-width:760px;margin:25px auto;padding:15px}article{background:white;padding:18px;border-radius:14px;margin:12px 0}button{padding:12px;border:0;border-radius:9px;background:#173d59;color:white;margin:5px;cursor:pointer}button:disabled{opacity:.5}small{color:#536777}nav a{margin-right:15px}#message{font-weight:bold}</style></head><body><nav><a href="?page=parent">Parent sign-off</a></nav><h1>🏆 James's Chores</h1><label>Month <input type="month" id="month"></label><p id="message"></p><article><h2 id="totals">Loading…</h2><p>Only approved chores count towards earnings. £50 savings are guaranteed; £20 extra savings unlock at 100%.</p></article><div id="tasks"></div><script>const el=id=>document.getElementById(id);const now=new Date();el('month').value=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');function fail(e){el('message').textContent=e.message||String(e)}function load(){el('message').textContent='Loading…';google.script.run.withSuccessHandler(render).withFailureHandler(fail).apiMonth(el('month').value)}function render(d){el('message').textContent='';el('totals').textContent=d.totals.completionPercent+'% approved · £'+d.totals.pocketMoney.toFixed(2)+' pocket money · £'+d.totals.totalSavings+' savings';const today=new Date().toISOString().slice(0,10);let html='';d.chores.forEach(c=>{html+='<article><h3>'+c.name+'</h3>';const days=new Date(+d.month.slice(0,4),+d.month.slice(5),0).getDate();for(let i=1;i<=days;i++){const date=d.month+'-'+String(i).padStart(2,'0');if(date>today)continue;const e=d.entries.find(e=>e.date===date&&e.choreId===c.id);html+='<div>'+date+': '+(e?e.status:'<button data-date="'+date+'" data-chore="'+c.id+'">Mark complete</button>')+'</div>';}html+='</article>'});el('tasks').innerHTML=html;document.querySelectorAll('[data-chore]').forEach(b=>b.onclick=()=>{b.disabled=true;google.script.run.withSuccessHandler(load).withFailureHandler(fail).apiSubmit(b.dataset.date,b.dataset.chore)})}el('month').onchange=load;load();</script></body></html>
