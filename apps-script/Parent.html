<!doctype html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parent Sign-off | Family Chores</title>
  <style>
    body {
      font: 16px system-ui;
      background: #eef4f7;
      color: #173d59;
      max-width: 760px;
      margin: 25px auto;
      padding: 15px;
    }

    article {
      background: white;
      padding: 18px;
      border-radius: 14px;
      margin: 12px 0;
    }

    button {
      padding: 12px;
      border: 0;
      border-radius: 9px;
      background: #173d59;
      color: white;
      margin: 5px;
      cursor: pointer;
    }

    button:disabled { opacity: 0.5; }
    input { padding: 9px; }
    small { color: #536777; }
    #message { font-weight: bold; }

    nav { margin-bottom: 18px; }

    .back {
      display: inline-block;
      background: #173d59;
      color: white;
      padding: 11px 16px;
      border-radius: 9px;
      text-decoration: none;
      font-weight: 600;
    }

    .back:hover { background: #245779; }
  </style>
</head>

<body>
  <nav>
    <a class="back"
       href="https://rstebbens.github.io/familychores/"
       target="_top">
      ← Back to Family Chores
    </a>
  </nav>

  <h1>🔐 Parent Sign-off</h1>

  <label for="pin">PIN</label>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off">

  <label for="month">Month</label>
  <input id="month" type="month">

  <button id="load" type="button">View pending</button>
  <p id="message" role="status"></p>

  <article>
    <h2 id="totals">Enter PIN to review</h2>
    <div id="pending"></div>
  </article>

  <article><h2>James's leave days</h2><p>Leave does not reduce his monthly earning potential.</p><input type="date" id="leave-date"><button id="add-leave">Approve leave</button><button id="remove-leave">Remove leave</button><p id="leave-balance"></p><p id="leave-list"></p></article>
  <article><h2>Create bonus task</h2><input id="bonus-name" placeholder="e.g. Wash the car" maxlength="120"><input id="bonus-amount" type="number" min="0.01" max="100" step="0.01" placeholder="£"><button id="create-bonus">Add task</button><div id="bonus-review"></div></article>
  <script>
    const el = id => document.getElementById(id);
    const now = new Date();
    let pending = [];

    el('month').value =
      now.getFullYear() + '-' +
      String(now.getMonth() + 1).padStart(2, '0');

    function fail(error) {
      el('message').textContent = error.message || String(error);
    }

    function load() {
      el('message').textContent = 'Loading…';

      google.script.run
        .withSuccessHandler(render)
        .withFailureHandler(fail)
        .apiParentMonth(el('pin').value, el('month').value);
    }

    function render(data) {
      el('message').textContent = '';

      const totals = data.totals;
      el('totals').textContent =
        totals.completionPercent + '% approved · £' +
        totals.pocketMoney.toFixed(2) + ' earned · £' +
        totals.totalSavings + ' savings';

      el('leave-balance').textContent = data.leaveAllowance.remaining + ' of 25 annual leave days remaining in ' + data.leaveAllowance.year + ' (bank holidays additional)';
      el('leave-list').textContent = data.leaveDays.length ? 'Leave: ' + data.leaveDays.join(', ') : 'No leave days this month';
      const bonuses = data.bonusTasks.filter(t => t.status === 'Pending');
      const bonusArea = el('bonus-review');
      bonusArea.innerHTML = '';
      bonuses.forEach(task => {
        const row = document.createElement('p');
        row.textContent = task.name + ' · £' + task.amount.toFixed(2) + ' → ' + task.destination + ' ';
        const yes = document.createElement('button');
        yes.textContent = 'Approve';
        yes.onclick = () => reviewBonus(task.id, true);
        const no = document.createElement('button');
        no.textContent = 'Reject';
        no.onclick = () => reviewBonus(task.id, false);
        row.appendChild(yes); row.appendChild(no); bonusArea.appendChild(row);
      });
      if (!bonuses.length) bonusArea.textContent = 'No bonus tasks awaiting approval';
      pending = data.entries.filter(entry => entry.status === 'Pending');

      if (!pending.length) {
        el('pending').textContent = 'No pending chores';
        return;
      }

      el('pending').innerHTML = pending.map((entry, index) => `
        <p>
          <label>
            <input type="checkbox" data-i="${index}" checked>
            ${entry.date} · ${entry.chore}
          </label>
          <select data-status="${index}">
            <option>Approved</option>
            <option>Rejected</option>
            <option>Not Needed</option>
          </select>
        </p>
      `).join('') + '<button id="approve">Sign off selected</button>';

      el('approve').onclick = signOff;
    }

    function signOff() {
      const decisions = [...document.querySelectorAll('[data-i]:checked')]
        .map(checkbox => {
          const index = Number(checkbox.dataset.i);
          const status = document.querySelector(
            '[data-status="' + index + '"]'
          ).value;

          return {
            id: pending[index].id,
            status: status
          };
        });

      if (!decisions.length) return;
      if (!confirm('Sign off ' + decisions.length + ' chores?')) return;

      el('approve').disabled = true;

      google.script.run
        .withSuccessHandler(load)
        .withFailureHandler(fail)
        .apiReview(el('pin').value, decisions);
    }

    function reviewBonus(id, approved) {
      google.script.run.withSuccessHandler(load).withFailureHandler(fail).apiReviewBonus(el('pin').value, id, approved);
    }
    function setLeave(enabled) {
      if (!el('leave-date').value) { el('message').textContent = 'Choose a date'; return; }
      google.script.run.withSuccessHandler(load).withFailureHandler(fail)
        .apiSetLeave(el('pin').value, el('leave-date').value, enabled);
    }
    el('add-leave').onclick = () => setLeave(true);
    el('remove-leave').onclick = () => setLeave(false);
    el('create-bonus').onclick = () => {
      google.script.run.withSuccessHandler(() => {
        el('bonus-name').value = ''; el('bonus-amount').value = ''; load();
      }).withFailureHandler(fail).apiCreateBonus(el('pin').value, el('bonus-name').value, el('bonus-amount').value);
    };
    el('load').onclick = load;
  </script>
</body>
</html>
