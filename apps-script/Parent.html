<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px system-ui;background:#eef4f7;color:#173d59;max-width:760px;margin:25px auto;padding:15px}article{background:white;padding:18px;border-radius:14px;margin:12px 0}button{padding:12px;border:0;border-radius:9px;background:#173d59;color:white;margin:5px;cursor:pointer}input{padding:9px}small{color:#536777}#message{font-weight:bold}</style></head><body><nav><a href="?page=child">James's chores</a></nav><h1>🔐 Parent Sign-off</h1><label>PIN <input id="pin" type="password" inputmode="numeric" autocomplete="off"></label><label> Month <input id="month" type="month"></label><button id="load">View pending</button><p id="message"></p><article><h2 id="totals">Enter PIN to review</h2><div id="pending"></div></article><script>const el=id=>document.getElementById(id),now=new Date();el('month').value=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');let pending=[];function fail(e){el('message').textContent=e.message||String(e)}function load(){el('message').textContent='Loading…';google.script.run.withSuccessHandler(render).withFailureHandler(fail).apiParentMonth(el('pin').value,el('month').value)}function render(d){el('message').textContent='';el('totals').textContent=d.totals.completionPercent+'% approved · £'+d.totals.pocketMoney.toFixed(2)+' earned · £'+d.totals.totalSavings+' savings';pending=d.entries.filter(e=>e.status==='Pending');el('pending').innerHTML=pending.length?pending.map((e,i)=>'<p><label><input type="checkbox" data-i="'+i+'" checked> '+e.date+' · '+e.chore+'</label> <select data-status="'+i+'"><option>Approved</option><option>Rejected</option><option>Not Needed</option></select></p>').join('')+'<button id="approve">Sign off selected</button>':'No pending chores';const b=el('approve');if(b)b.onclick=()=>{const decisions=[...document.querySelectorAll('[data-i]:checked')].map(x=>({id:pending[+x.dataset.i].id,status:document.querySelector('[data-status="'+x.dataset.i+'"]').value}));if(!decisions.length)return;if(!confirm('Sign off '+decisions.length+' chores?'))return;b.disabled=true;google.script.run.withSuccessHandler(load).withFailureHandler(fail).apiReview(el('pin').value,decisions)}}el('load').onclick=load;</script></body></html>
